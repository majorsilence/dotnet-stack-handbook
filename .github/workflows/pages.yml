name: Build and deploy book

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  chapters:
    name: Check the chapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Structural checks
        # Front matter, fence balance, heading levels, and every cross-chapter
        # link and anchor resolving to something that exists.
        run: ./tools/check-chapters.py

  examples:
    name: Build and test the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build every example project
        # This is the job that makes the book's code more than a claim.  If a
        # listing stops compiling, this fails.
        run: dotnet build examples/Examples.slnx --configuration Release

      - name: Run the tests
        run: >-
          dotnet test examples/Examples.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage" --logger:"nunit"

      - name: Run the console examples
        # Building proves they compile; running proves the output the chapters
        # print is the output you actually get.
        run: |
          for p in Examples.Language Examples.Language.Vb Examples.Concurrency \
                   Examples.AppStructure Examples.Data; do
            echo "=== $p ==="
            dotnet run --project "examples/$p" --configuration Release --no-build
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            examples/**/TestResults/**
          if-no-files-found: ignore

  pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            lmodern

      - name: Build the PDF
        run: ./tools/build-pdf.sh --output build/dotnet-stack-handbook.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-stack-handbook-pdf
          path: build/dotnet-stack-handbook.pdf
          if-no-files-found: error

  site:
    name: Build site
    runs-on: ubuntu-latest
    needs: [chapters, examples, pdf]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v6
        id: pages
        with:
          # Turn Pages on via the API rather than requiring someone to set the
          # source to "GitHub Actions" by hand in the repository settings.
          enablement: true

      - name: Collect the PDF built above
        uses: actions/download-artifact@v8
        with:
          name: dotnet-stack-handbook-pdf
          path: .

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination _site

      - name: Publish the PDF alongside the site
        run: cp dotnet-stack-handbook.pdf _site/dotnet-stack-handbook.pdf

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
